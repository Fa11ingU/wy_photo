<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VISUAL EP: WONYOUNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0c;--bg2:#0e0e12;--surface:#121216;--surface2:#1a1a20;
  --text:#eae6e2;--text-dim:#8a8580;--text-faint:#555258;
  --accent:#c9a87c;--accent-dim:#8b7355;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'Inter','Helvetica Neue',sans-serif;font-weight:300;
  background:var(--bg);color:var(--text);
  overflow:hidden;height:100vh;width:100vw;
  -webkit-user-select:none;user-select:none;
}

/* Ambient */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;animation:fi 0.8s 0.3s ease forwards}
.ambient-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(80px);opacity:0.3;transition:opacity 1.2s ease}
.ambient-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,10,12,0.6)0%,rgba(10,10,12,0.2)50%,rgba(10,10,12,0.6)100%)}
.noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* App Layout */
.app{position:relative;z-index:1;display:flex;height:100vh;width:100vw;opacity:0;animation:fi 0.8s 0.4s ease forwards}
@keyframes fi{to{opacity:1}}
.photo-zone{flex:0 0 60%;position:relative;overflow:hidden;background:var(--bg)}
.panel-zone{flex:0 0 40%;display:flex;flex-direction:column;padding:48px 40px 0;position:relative}
.panel-scroll{flex:1;overflow-y:auto;padding-bottom:24px}

/* Viewer */
.viewer{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.photo-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform,opacity}
.photo-frame.A{z-index:2}
.photo-frame.B{z-index:1}

/* Ken Burns */
.photo-frame.A img{animation:kenBurns 6s var(--ease-out) forwards}
.photo-frame.B img{animation:kenBurns 6s var(--ease-out) forwards}
.photo-frame.paused img{animation-play-state:paused}
@keyframes kenBurns{0%{transform:scale(1)}100%{transform:scale(1.04)}}

/* Cross-fade: A fade out / B fade in */
.photo-frame.A.fade-out img{transition:opacity 0.8s ease;opacity:0}
.photo-frame.B.fade-in img{opacity:0;transition:opacity 0.8s ease}
.photo-frame.B.fade-in.active img{opacity:1}
.photo-frame.B.fade-in img{opacity:0;transition:opacity 0.8s ease}
.photo-frame.done img{opacity:0;transition:none}

/* Album Header */
.album-header{margin-bottom:36px}
.album-header .ep-label{font-size:0.55rem;font-weight:400;letter-spacing:0.4em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:8px}
.album-header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,2.5vw,2.2rem);font-weight:300;letter-spacing:0.04em;color:var(--text);line-height:1.2}
.album-header .divider{width:24px;height:1px;background:var(--accent-dim);margin:14px 0;opacity:0.4}

/* Tracklist */
.tracklist{display:flex;flex-direction:column;gap:2px}
.chapter-group{margin-bottom:18px}
.chapter-header{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.chapter-header .ch-num{font-family:'Cormorant Garamond',serif;font-size:0.7rem;font-weight:400;font-style:italic;color:var(--accent-dim);width:18px}
.chapter-header .ch-title{font-size:0.55rem;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim)}
.chapter-header .ch-sub{font-size:0.5rem;font-weight:200;letter-spacing:0.12em;color:var(--text-faint);margin-left:auto}
.chapter-header .ch-line{flex:1;height:1px;background:var(--surface2)}
.track{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;border-radius:3px;transition:all 0.3s ease;position:relative}
.track:hover{background:rgba(255,255,255,0.03)}
.track.active{background:rgba(201,168,124,0.06)}
.track.active .t-num{color:var(--accent)}
.track.active .t-label{color:var(--text)}
.track .t-num{font-family:'Cormorant Garamond',serif;font-size:0.65rem;font-weight:400;color:var(--text-faint);width:24px;transition:color 0.3s}
.track .t-label{font-size:0.65rem;font-weight:300;letter-spacing:0.06em;color:var(--text-dim);transition:color 0.3s}
.track .t-duration{margin-left:auto;font-size:0.5rem;font-weight:200;color:var(--text-faint)}

/* PC Player — sticky at bottom of panel */
.player-controls{
  flex-shrink:0;padding:20px 40px 24px;margin-left:-40px;margin-right:-40px;
  border-top:1px solid var(--surface2);
  background:var(--bg);
}
.controls-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.btn-play{width:38px;height:38px;border:1px solid rgba(255,255,255,0.12);border-radius:50%;background:rgba(255,255,255,0.04);color:var(--text);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s ease;backdrop-filter:blur(10px)}
.btn-play:hover{border-color:var(--accent);color:var(--accent);background:rgba(201,168,124,0.08)}
.btn-prev,.btn-next{width:26px;height:26px;border:none;background:none;color:var(--text-dim);font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color 0.3s}
.btn-prev:hover,.btn-next:hover{color:var(--accent)}
.track-info{flex:1;min-width:0}
.track-info .ti-name{font-size:.6rem;font-weight:300;letter-spacing:.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-info .ti-chapter{font-size:.48rem;font-weight:200;letter-spacing:.12em;color:var(--text-faint);margin-top:2px}
.progress-wrap{width:100%;height:3px;background:var(--surface2);border-radius:2px;cursor:pointer;position:relative}
.progress-bar{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 0.1s linear}

/* Mobile */
@media(max-width:768px){
  .app{flex-direction:column}
  .photo-zone{flex:0 0 65%}
  .panel-zone{flex:1;padding:20px 18px 0}
  .panel-scroll{flex:1;overflow-y:auto;padding-bottom:20px}
  .album-header{margin-bottom:16px}
  .album-header h1{font-size:1.1rem}
  .chapter-group{margin-bottom:12px}
  .player-controls{padding:16px 18px 20px;margin-left:-18px;margin-right:-18px}

  .tracklist-sheet{
    position:fixed;bottom:0;left:0;right:0;z-index:100;
    background:var(--bg);border-radius:16px 16px 0 0;
    padding:16px 20px 24px;
    transform:translateY(100%);transition:transform 0.5s var(--ease-out);
    max-height:65vh;overflow-y:auto;
    border-top:1px solid var(--surface2)
  }
  .tracklist-sheet.open{transform:translateY(0)}
  .tracklist-sheet .sheet-handle{width:32px;height:3px;border-radius:2px;background:var(--text-faint);margin:0 auto 16px;opacity:0.4}

  .mobile-player{
    display:flex!important;position:fixed;bottom:0;left:0;right:0;z-index:99;
    background:rgba(10,10,12,0.95);backdrop-filter:blur(20px);
    padding:10px 16px;align-items:center;gap:12px;
    border-top:1px solid var(--surface2)
  }
  .mobile-player .mp-info{flex:1;min-width:0}
  .mobile-player .mp-name{font-size:.55rem;font-weight:300;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-player .mp-chapter{font-size:.45rem;font-weight:200;color:var(--text-faint)}
  .sheet-btn{
    display:flex!important;width:100%;padding:8px 0;border:none;background:none;
    color:var(--accent-dim);font-size:.55rem;letter-spacing:.12em;cursor:pointer;
    align-items:center;justify-content:center;gap:6px;font-family:'Inter',sans-serif
  }
  .pc-only{display:none!important}
}
@media(min-width:769px){
  .mobile-only{display:none!important}
}
@media(max-width:480px){
  .photo-zone{flex:0 0 55%}
  .panel-zone{padding:14px}
  .album-header h1{font-size:.95rem}
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
</style>
</head>
<body>

<div class="ambient" id="ambient"><div class="ambient-bg" id="ambientBg"></div><div class="ambient-overlay"></div></div>
<div class="noise"></div>

<div class="app">
  <div class="photo-zone">
    <div class="viewer" id="viewer">
      <div class="photo-frame A" id="frameA"><img id="imgA" alt=""></div>
      <div class="photo-frame B" id="frameB"><img id="imgB" alt=""></div>
    </div>
  </div>

  <div class="panel-zone">
    <div class="panel-scroll">
      <div class="album-header">
        <div class="ep-label">Silent Visual EP</div>
        <h1>VISUAL EP:<br>WONYOUNG</h1>
        <div class="divider"></div>
      </div>

      <div class="tracklist pc-only" id="tracklistPC"></div>

      <button class="sheet-btn mobile-only" id="sheetToggle">☰ VIEW TRACKLIST</button>
    </div>

    <div class="player-controls pc-only">
      <div class="controls-row">
        <button class="btn-prev" id="pcPrev">◀</button>
        <button class="btn-play" id="pcPlay">▶</button>
        <button class="btn-next" id="pcNext">▶▶</button>
        <div class="track-info"><div class="ti-name" id="tiName">Take 01</div><div class="ti-chapter" id="tiChapter">Chapter I</div></div>
      </div>
      <div class="progress-wrap" id="pcProgress"><div class="progress-bar" id="pcBar"></div></div>
    </div>
  </div> <!-- close panel-zone -->
</div> <!-- close app -->

<div class="tracklist-sheet mobile-only" id="tracklistSheet">
  <div class="sheet-handle"></div>
  <div class="tracklist" id="tracklistMobile"></div>
</div>

<div class="mobile-player mobile-only">
  <button class="btn-prev" id="mPrev">◀</button>
  <button class="btn-play" id="mPlay">▶</button>
  <button class="btn-next" id="mNext">▶▶</button>
  <div class="mp-info"><div class="mp-name" id="mpName">Take 01</div><div class="mp-chapter" id="mpChapter">Chapter I</div></div>
  <div class="progress-wrap" style="position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0"><div class="progress-bar" id="mBar"></div></div>
</div>

<script>
// ===== DATA =====
const DIR='https://cdn.jsdelivr.net/gh/Fa11ingU/wy_photo@main/wy_pic/';
const FILES=[
  'IMG_3971.jpeg','IMG_4083.jpeg','IMG_4085.jpeg','IMG_4086.jpeg',
  'IMG_4087.jpeg','IMG_4088.jpeg','IMG_4089.jpeg','IMG_4090.jpeg',
  'IMG_4091.jpeg','IMG_4092.jpeg','IMG_4093.jpeg','IMG_4094.jpeg',
  'IMG_4095.jpeg','IMG_4096.jpeg','IMG_4097.jpeg','IMG_4098.jpeg',
  'IMG_4099.jpeg','IMG_4100.jpeg','IMG_4101.jpeg','IMG_4102.jpeg',
  'IMG_4103.jpeg','IMG_4104.jpeg','IMG_4105.jpeg','IMG_4106.jpeg',
  'IMG_4107.jpeg','IMG_4108.jpeg','IMG_4109.jpeg','IMG_4111.jpeg',
  'IMG_4112.jpeg','IMG_4113.jpeg','IMG_4114.jpeg','IMG_4115.jpeg',
  'IMG_4116.jpeg','IMG_4117.jpeg'
];
const LABELS=[
  'Portrait','Study in Light','Moment Captured','Editorial',
  'Close-Up','In Frame','Still Life','Vérité',
  'The Gaze','Silhouette','Radiance','Poise',
  'Presence','Quiet Drama','Aperture','Grace Note',
  'Composition','The Look','Lumière','Character Study',
  'Soft Power','Quiet Confidence','Golden Hour','The Muse',
  'From Stage','Center Frame','Spotlight','Encore',
  'Curtain Call','Afterglow','Reborn','Icon','Legacy','Final Bow'
];
const CHAPTERS=[
  {id:'I',title:'The Shadows',sub:'暗调 · 沉思 · 轮廓',s:0,e:7},
  {id:'II',title:'The Candid',sub:'随性 · 记录 · 松弛感',s:8,e:16},
  {id:'III',title:'The Gaze',sub:'特写 · 张力 · 绝对聚焦',s:17,e:25},
  {id:'IV',title:'The Stage',sub:'高光 · 舞台 · 纯粹',s:26,e:33},
];

function getChapter(i){return CHAPTERS.find(c=>i>=c.s&&i<=c.e)||CHAPTERS[0]}

// ===== STATE =====
let idx=0,playing=false,prog=0,intv=null,transTimer=null;
const CYCLE=6000,TICK=100;

// ===== DOM HELPERS =====
function $(id){return document.getElementById(id)}
function setText(id,val){const e=$(id);if(e)e.textContent=val}
function getFrame(label){
  const el=$(label);
  return {frame:el, img:el.querySelector('img')};
}

// Frame convention: we use CSS class 'A' to mark the currently-showing frame.
// The other frame is always 'B' (the hidden/buffer frame).
// After a transition, we swap: old-A → done-clean, old-B → new-A.
function currentPair(){
  const a=$('frameA'),b=$('frameB');
  if(a.classList.contains('A')) return {cur:$('frameA'),nxt:$('frameB'),ci:a.querySelector('img'),ni:b.querySelector('img')};
  return {cur:$('frameB'),nxt:$('frameA'),ci:b.querySelector('img'),ni:a.querySelector('img')};
}

const cache={};
function preloadNext(i){
  const nxt=(i+1)%34,s=DIR+FILES[nxt];
  if(!cache[s]){cache[s]=new Image();cache[s].src=s}
}

// ===== BUILD TRACKLIST =====
function buildTracklist(container){
  container.innerHTML='';
  CHAPTERS.forEach(ch=>{
    const g=document.createElement('div');g.className='chapter-group';
    g.innerHTML=`<div class="chapter-header"><span class="ch-num">${ch.id}</span><span class="ch-title">${ch.title}</span><span class="ch-sub">${ch.sub}</span><span class="ch-line"></span></div>`;
    for(let i=ch.s;i<=ch.e;i++){
      const t=document.createElement('div');t.className='track';t.dataset.idx=i;
      t.innerHTML=`<span class="t-num">${String(i+1).padStart(2,'0')}</span><span class="t-label">${LABELS[i]}</span><span class="t-duration">${ch.id}</span>`;
      t.addEventListener('click',()=>go(i));
      g.appendChild(t);
    }
    container.appendChild(g);
  });
}
buildTracklist($('tracklistPC'));
buildTracklist($('tracklistMobile'));

// ===== UPDATE UI =====
function updateUI(i){
  const ch=getChapter(i);
  const label=`Take ${String(i+1).padStart(2,'0')} — ${LABELS[i]}`;
  setText('tiName',label);setText('tiChapter',`Chapter ${ch.id}: ${ch.title}`);
  setText('mpName',label);setText('mpChapter',`Chapter ${ch.id}: ${ch.title}`);
  document.querySelectorAll('.track').forEach(t=>t.classList.toggle('active',parseInt(t.dataset.idx)===i));
  document.querySelectorAll(`.track[data-idx="${i}"]`).forEach(t=>t.scrollIntoView({block:'nearest',behavior:'smooth'}));
}

// ===== CORE: GO TO INDEX =====
function go(i){
  if(i<0||i>33)return;

  // If already showing this index, just reset progress
  if(i===idx){resetProg();return;}

  // Cancel any in-flight transition timer
  if(transTimer){clearTimeout(transTimer);transTimer=null;}

  // Pause the progress interval during the transition to prevent
  // the interval from firing multiple go() calls while cross-fading.
  // We record the playing state and temporarily suppress ticks.
  const wasPlaying = playing;
  if(wasPlaying) stopProg();

  idx=i;
  const src=DIR+FILES[i];
  updateUI(i);

  // Get current state from DOM (authoritative, not cached in variables)
  let {cur, nxt, ci, ni} = currentPair();

  // Ensure target image is loaded (or loading)
  if(!cache[src]){cache[src]=new Image();cache[src].src=src}

  // Put target on the hidden frame — always create a fresh <img>
  const fresh = document.createElement('img');
  fresh.src = src;
  fresh.alt = '';
  fresh.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;will-change:transform,opacity';
  ni.replaceWith(fresh);

  // Start cross-fade
  cur.classList.add('fade-out');
  nxt.classList.add('fade-in','active');

  // After transition: swap roles and cleanup
  transTimer = setTimeout(()=>{
    transTimer=null;

    // Clean old frame — clear img src and reset classes
    cur.querySelector('img').src = '';
    cur.className = 'photo-frame B done';
    const dead = cur.querySelector('img');
    const empty = document.createElement('img');
    empty.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;will-change:transform,opacity';
    dead.replaceWith(empty);

    // Promote next to current
    nxt.className = 'photo-frame A';
    if(wasPlaying) nxt.classList.remove('paused');
    else nxt.classList.add('paused');

    // Update ambient
    $('ambientBg').style.backgroundImage=`url('${src}')`;

    resetProg();
    preloadNext(i);

    // Resume the interval if was playing
    if(wasPlaying) startProg();
  }, 850);
}

// ===== Force-reset Ken Burns on current frame =====
function resetKenBurns(){
  const {cur, ci} = currentPair();
  if(!cur)return;
  const src = ci.src;
  const fresh = document.createElement('img');
  fresh.src = src;
  fresh.alt = '';
  fresh.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;will-change:transform,opacity';
  ci.replaceWith(fresh);
  cur.classList.remove('paused');
}

// ===== PROGRESS =====
function resetProg(){
  prog=0;
  document.querySelectorAll('.progress-bar').forEach(b=>b.style.width='0%');
}

function startProg(){
  stopProg();prog=0;
  resetProg();
  intv=setInterval(()=>{
    if(!playing)return;
    prog+=(TICK/CYCLE)*100;
    if(prog>=100){prog=100;
      document.querySelectorAll('.progress-bar').forEach(b=>b.style.width='100%');
      go(idx+1);
      return;
    }
    document.querySelectorAll('.progress-bar').forEach(b=>b.style.width=prog+'%');
    if(prog>=40)preloadNext(idx);
  },TICK);
}

function stopProg(){if(intv){clearInterval(intv);intv=null}}

// ===== PLAY/PAUSE =====
function togglePlay(){
  playing=!playing;
  const icon=playing?'❚❚':'▶';
  document.querySelectorAll('.btn-play').forEach(b=>b.textContent=icon);
  if(playing){
    document.querySelectorAll('.photo-frame.A').forEach(f=>f.classList.remove('paused'));
    resetKenBurns();
    startProg();
  }else{
    document.querySelectorAll('.photo-frame.A').forEach(f=>f.classList.add('paused'));
    stopProg();
  }
}

function next(){go(idx+1)}
function prev(){go(idx-1)}

// ===== PROGRESS CLICK =====
document.querySelectorAll('.progress-wrap').forEach(el=>{
  el.addEventListener('click',e=>{
    const r=el.getBoundingClientRect();
    const p=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100));
    prog=p;
    document.querySelectorAll('.progress-bar').forEach(b=>b.style.width=p+'%');
  });
});

// ===== EVENTS =====
['pcPlay','mPlay'].forEach(id=>$(id)?.addEventListener('click',togglePlay));
['pcNext','mNext'].forEach(id=>$(id)?.addEventListener('click',next));
['pcPrev','mPrev'].forEach(id=>$(id)?.addEventListener('click',prev));

document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePlay()}
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
});

// ===== SHEET (mobile) =====
const sheet=$('tracklistSheet'),sBtn=$('sheetToggle');
sBtn?.addEventListener('click',()=>{
  sheet.classList.toggle('open');
  sBtn.textContent=sheet.classList.contains('open')?'✕ CLOSE':'☰ VIEW TRACKLIST';
});
document.addEventListener('click',e=>{
  if(e.target.closest('.track')&&sheet?.classList.contains('open')){
    sheet.classList.remove('open');
    if(sBtn)sBtn.textContent='☰ VIEW TRACKLIST';
  }
});

// ===== INIT =====
// First load: only download image 0
const i0=$('imgA');
i0.src=DIR+FILES[0];
// Ensure current frame is visible
$('frameA').classList.add('A');
$('frameA').classList.remove('paused');
updateUI(0);
$('ambientBg').style.backgroundImage=`url('${DIR+FILES[0]}')`;
prog=0;
// Preload second image in background
preloadNext(0);
</script>
</body>
</html>
