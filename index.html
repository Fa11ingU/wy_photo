<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANG WONYOUNG — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f9f8f6;
  --text: #1a1a1c;
  --text-muted: #6b6b6f;
  --text-faint: #a8a8ac;
  --accent: #b8976e;
  --spacing-xs: 8px;
  --spacing-sm: 24px;
  --spacing-md: 48px;
  --spacing-lg: 80px;
  --spacing-xl: 140px;
  --spacing-2xl: 200px;
  --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
}

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', sans-serif;
  font-weight: 300;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Selection */
::selection {
  background: rgba(184, 151, 110, 0.2);
  color: var(--text);
}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.serif       { font-family: 'Cormorant Garamond', 'Georgia', 'Noto Serif SC', serif; }
.sans        { font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', sans-serif; }
.fw-200      { font-weight: 200; }
.fw-300      { font-weight: 300; }
.fw-400      { font-weight: 400; }
.italic      { font-style: italic; }
.tracking-xs { letter-spacing: 0.02em; }
.tracking-sm { letter-spacing: 0.06em; }
.tracking-md { letter-spacing: 0.14em; }
.tracking-lg { letter-spacing: 0.26em; }
.text-muted  { color: var(--text-muted); }
.text-faint  { color: var(--text-faint); }
.text-accent { color: var(--accent); }

/* ============================================================
   HERO — Full viewport intro
   ============================================================ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-lg);
}

/* ============================================================
   LEAF PILE — Scattered thumbnail collage
   ============================================================ */
.leaf-pile {
  position: relative;
  width: 100%;
  max-width: 680px;
  height: 320px;
  margin: 0 auto var(--spacing-lg);
  pointer-events: auto;
}

.leaf-pile .leaf {
  position: absolute;
  cursor: pointer;
  transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
              z-index 0s step-end;
  will-change: transform;
}

.leaf-pile .leaf img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.12),
    0 8px 20px rgba(0,0,0,0.06);
  transition: box-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Polaroid variant */
.leaf-pile .leaf.polaroid-leaf {
  background: #fff;
  padding: 6px 6px 24px 6px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  border-radius: 2px;
}
.leaf-pile .leaf.polaroid-leaf img {
  border-radius: 1px;
  box-shadow: none;
}

/* Tape variant */
.leaf-pile .leaf.taped-leaf::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%) rotate(1deg);
  width: 40px;
  height: 12px;
  background: rgba(220,215,200,0.7);
  z-index: 2;
  border-radius: 1px;
}

/* Hover: lift the leaf */
.leaf-pile .leaf:hover {
  z-index: 999 !important;
  transform: translateY(-10px) rotate(0deg) !important;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              z-index 0s step-start;
}
.leaf-pile .leaf:hover img {
  box-shadow:
    0 12px 32px rgba(0,0,0,0.22),
    0 4px 12px rgba(0,0,0,0.1);
}

/* Adjacent leaves get a subtle nudge */
.leaf-pile .leaf:hover ~ .leaf {
  transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Leaf entrance animation — gentle float down */
.leaf-pile .leaf {
  opacity: 0;
  transform: translateY(-40px) rotate(var(--leaf-rot, 0deg)) scale(0.85);
  animation: leafFall 1.4s var(--ease-out-quint) forwards;
}

@keyframes leafFall {
  0%   { opacity: 0; transform: translateY(-40px) rotate(var(--leaf-rot, 0deg)) scale(0.85); }
  60%  { opacity: 1; transform: translateY(6px) rotate(calc(var(--leaf-rot, 0deg) * 0.6)) scale(1.02); }
  80%  { opacity: 1; transform: translateY(-2px) rotate(calc(var(--leaf-rot, 0deg) * 1.05)) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) rotate(var(--leaf-rot, 0deg)) scale(1); }
}

/* Stagger leaf falls */
.leaf-pile .leaf:nth-child(1)  { animation-delay: 0.02s; }
.leaf-pile .leaf:nth-child(2)  { animation-delay: 0.06s; }
.leaf-pile .leaf:nth-child(3)  { animation-delay: 0.10s; }
.leaf-pile .leaf:nth-child(4)  { animation-delay: 0.14s; }
.leaf-pile .leaf:nth-child(5)  { animation-delay: 0.18s; }
.leaf-pile .leaf:nth-child(6)  { animation-delay: 0.22s; }
.leaf-pile .leaf:nth-child(7)  { animation-delay: 0.26s; }
.leaf-pile .leaf:nth-child(8)  { animation-delay: 0.30s; }
.leaf-pile .leaf:nth-child(9)  { animation-delay: 0.34s; }
.leaf-pile .leaf:nth-child(10) { animation-delay: 0.38s; }
.leaf-pile .leaf:nth-child(11) { animation-delay: 0.42s; }
.leaf-pile .leaf:nth-child(12) { animation-delay: 0.46s; }
.leaf-pile .leaf:nth-child(13) { animation-delay: 0.50s; }
.leaf-pile .leaf:nth-child(14) { animation-delay: 0.54s; }
.leaf-pile .leaf:nth-child(15) { animation-delay: 0.58s; }
.leaf-pile .leaf:nth-child(16) { animation-delay: 0.62s; }
.leaf-pile .leaf:nth-child(17) { animation-delay: 0.66s; }
.leaf-pile .leaf:nth-child(18) { animation-delay: 0.70s; }
.leaf-pile .leaf:nth-child(19) { animation-delay: 0.74s; }
.leaf-pile .leaf:nth-child(20) { animation-delay: 0.78s; }
.leaf-pile .leaf:nth-child(21) { animation-delay: 0.82s; }
.leaf-pile .leaf:nth-child(22) { animation-delay: 0.86s; }
.leaf-pile .leaf:nth-child(23) { animation-delay: 0.90s; }
.leaf-pile .leaf:nth-child(24) { animation-delay: 0.94s; }
.leaf-pile .leaf:nth-child(25) { animation-delay: 0.98s; }
.leaf-pile .leaf:nth-child(26) { animation-delay: 1.02s; }
.leaf-pile .leaf:nth-child(27) { animation-delay: 1.06s; }
.leaf-pile .leaf:nth-child(28) { animation-delay: 1.10s; }
.leaf-pile .leaf:nth-child(29) { animation-delay: 1.14s; }
.leaf-pile .leaf:nth-child(30) { animation-delay: 1.18s; }
.leaf-pile .leaf:nth-child(31) { animation-delay: 1.22s; }
.leaf-pile .leaf:nth-child(32) { animation-delay: 1.26s; }
.leaf-pile .leaf:nth-child(33) { animation-delay: 1.30s; }
.leaf-pile .leaf:nth-child(34) { animation-delay: 1.34s; }

/* Leaf pile responsive */
@media (max-width: 640px) {
  .leaf-pile {
    height: 220px;
    max-width: 100%;
    margin-bottom: var(--spacing-md);
  }
}

/* ============================================================
   HERO TEXT
   ============================================================ */
.hero-inner {
  max-width: 700px;
}

.hero-rule {
  width: 1px;
  height: 64px;
  background: linear-gradient(to bottom, transparent, var(--accent), transparent);
  margin: 0 auto var(--spacing-md);
  opacity: 0.5;
}

.hero-tag {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--spacing-md);
}

.hero h1 {
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  font-size: clamp(2.8rem, 6vw, 5.5rem);
  font-weight: 300;
  line-height: 1.08;
  letter-spacing: 0.03em;
  color: var(--text);
  margin-bottom: var(--spacing-sm);
}

.hero h1 em {
  display: block;
  font-size: 0.42em;
  font-weight: 300;
  letter-spacing: 0.28em;
  color: var(--accent);
  font-style: normal;
  margin-bottom: 6px;
}

.hero p {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 300;
  letter-spacing: 0.16em;
  color: var(--text-muted);
  line-height: 2.2;
}

/* ============================================================
   LAYOUT MODULES — shared
   ============================================================ */
.module {
  position: relative;
  padding: 0 var(--spacing-lg);
  margin: 0 auto;
  max-width: 1600px;
}

/* ============================================================
   MODULE A — Tension Close-Up
   Photo 40% width on left, massive whitespace right
   ============================================================ */
.module-a {
  display: flex;
  align-items: center;
  min-height: 100vh;
  padding-top: var(--spacing-xl);
  padding-bottom: var(--spacing-xl);
  gap: 0;
}

.module-a .a-visual {
  flex: 0 0 40%;
  position: relative;
}

.module-a .a-visual img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.module-a .a-copy {
  flex: 0 0 60%;
  padding-left: clamp(60px, 10vw, 140px);
}

.module-a .a-label {
  font-size: 0.6rem;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--spacing-sm);
}

.module-a .a-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 3.5vw, 3.2rem);
  font-weight: 400;
  font-style: italic;
  line-height: 1.25;
  margin-bottom: var(--spacing-sm);
  color: var(--text);
}

.module-a .a-note {
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  max-width: 320px;
  line-height: 1.8;
}

/* Reverse: photo on right */
.module-a.reverse {
  flex-direction: row-reverse;
}
.module-a.reverse .a-copy {
  padding-left: 0;
  padding-right: clamp(60px, 10vw, 140px);
}

/* ============================================================
   MODULE B — Breathing Landscape
   Centered horizontal photo, huge vertical whitespace
   ============================================================ */
.module-b {
  text-align: center;
  padding-top: var(--spacing-2xl);
  padding-bottom: var(--spacing-2xl);
}

.module-b .b-frame {
  display: inline-block;
  max-width: 65%;
  position: relative;
}

.module-b .b-frame img {
  width: 100%;
  height: auto;
  display: block;
}

.module-b .b-caption {
  margin-top: var(--spacing-sm);
  font-size: 0.62rem;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* ============================================================
   MODULE C — Diagonal Duo
   Top-left medium + bottom-right small
   ============================================================ */
.module-c {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: var(--spacing-lg);
  align-items: start;
  padding-top: var(--spacing-xl);
  padding-bottom: var(--spacing-xl);
  min-height: 100vh;
}

.module-c .c-main {
  grid-column: 1;
  grid-row: 1 / 3;
  align-self: center;
}

.module-c .c-main img {
  width: 100%;
  height: auto;
  display: block;
}

.module-c .c-sub {
  grid-column: 2;
  grid-row: 2;
  justify-self: end;
  max-width: 70%;
}

.module-c .c-sub img {
  width: 100%;
  height: auto;
  display: block;
}

.module-c .c-caption {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  align-self: end;
  text-align: right;
  max-width: 260px;
  padding-bottom: var(--spacing-sm);
}

.module-c .c-label {
  font-size: 0.6rem;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--spacing-xs);
}

.module-c .c-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.4rem, 2.5vw, 2.2rem);
  font-weight: 400;
  font-style: italic;
  line-height: 1.3;
  color: var(--text);
}

/* Reverse diagonal */
.module-c.reverse .c-main {
  grid-column: 2;
}
.module-c.reverse .c-sub {
  grid-column: 1;
  justify-self: start;
}
.module-c.reverse .c-caption {
  grid-column: 1;
  justify-self: start;
  text-align: left;
}

/* ============================================================
   MODULE D — Full Bleed
   100% width, no border, chapter transition
   ============================================================ */
.module-d {
  padding: 0;
  margin: var(--spacing-2xl) 0;
}

.module-d img {
  width: 100%;
  height: auto;
  display: block;
}

.module-d .d-overlay {
  position: absolute;
  bottom: var(--spacing-lg);
  left: var(--spacing-lg);
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  z-index: 2;
}

.module-d .d-overlay .d-chapter {
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  opacity: 0.8;
}

.module-d .d-overlay .d-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 300;
  font-style: italic;
}

/* ============================================================
   MODULE E — Column with copy
   Narrow centered photo with editorial text beside
   ============================================================ */
.module-e {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(40px, 8vw, 100px);
  padding-top: var(--spacing-xl);
  padding-bottom: var(--spacing-xl);
  min-height: 80vh;
}

.module-e .e-photo {
  flex: 0 0 45%;
}

.module-e .e-photo img {
  width: 100%;
  height: auto;
  display: block;
}

.module-e .e-text {
  flex: 0 0 35%;
}

.module-e .e-index {
  font-family: 'Cormorant Garamond', serif;
  font-size: 4rem;
  font-weight: 300;
  font-style: italic;
  color: var(--accent);
  line-height: 1;
  opacity: 0.5;
  margin-bottom: var(--spacing-xs);
}

.module-e .e-label {
  font-size: 0.6rem;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--spacing-sm);
}

.module-e .e-quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.2rem, 2vw, 1.8rem);
  font-weight: 400;
  font-style: italic;
  line-height: 1.4;
  color: var(--text);
}

/* ============================================================
   GALLERY SECTION DIVIDER
   ============================================================ */
.divider {
  text-align: center;
  padding: var(--spacing-2xl) var(--spacing-lg) var(--spacing-xl);
}

.divider-inner {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-sm);
}

.divider-rule {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, transparent, var(--accent), transparent);
  opacity: 0.35;
}

.divider-label {
  font-size: 0.6rem;
  font-weight: 400;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.divider-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
  font-weight: 300;
  font-style: italic;
  color: var(--text);
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  text-align: center;
  padding: var(--spacing-2xl) var(--spacing-lg);
  color: var(--text-faint);
  font-size: 0.6rem;
  font-weight: 300;
  letter-spacing: 0.22em;
}

.footer-rule {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, transparent, var(--text-faint), transparent);
  margin: 0 auto var(--spacing-md);
  opacity: 0.25;
}

/* ============================================================
   REVEAL ANIMATION (Intersection Observer driven)
   ============================================================ */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  will-change: transform, opacity;
}

.reveal.is-visible {
  animation: revealUp 1.2s var(--ease-out-quint) forwards;
}

@keyframes revealUp {
  0%   { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Staggered delays for children inside a revealed container */
.reveal-stagger > .reveal:nth-child(1) { animation-delay: 0s; }
.reveal-stagger > .reveal:nth-child(2) { animation-delay: 0.15s; }
.reveal-stagger > .reveal:nth-child(3) { animation-delay: 0.3s; }
.reveal-stagger > .reveal:nth-child(4) { animation-delay: 0.45s; }

/* For modules that should reveal as a whole */
.module.reveal.is-visible > * {
  animation: revealUp 1.2s var(--ease-out-quint) forwards;
}
.module.reveal.is-visible > *:nth-child(1) { animation-delay: 0s; }
.module.reveal.is-visible > *:nth-child(2) { animation-delay: 0.12s; }
.module.reveal.is-visible > *:nth-child(3) { animation-delay: 0.24s; }
.module.reveal.is-visible > *:nth-child(4) { animation-delay: 0.36s; }

.module.reveal > * {
  opacity: 0;
  transform: translateY(30px);
}

/* ============================================================
   PHOTO HOVER
   ============================================================ */
img.photo {
  display: block;
  transition: filter 0.5s ease, opacity 1.2s var(--ease-out-quint);
  cursor: default;
}

.photo-wrapper {
  position: relative;
  display: block;
  overflow: hidden;
}

.photo-wrapper:hover img.photo {
  filter: brightness(0.92);
}

.photo-wrapper:hover {
  cursor: crosshair;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
  :root {
    --spacing-lg: 48px;
    --spacing-xl: 80px;
    --spacing-2xl: 120px;
  }
  .module { padding: 0 var(--spacing-md); }
  .module-a { flex-direction: column; min-height: auto; gap: var(--spacing-md); }
  .module-a .a-visual { flex: 0 0 auto; width: 70%; }
  .module-a .a-copy { flex: 0 0 auto; padding-left: 0; padding-right: 0; width: 70%; }
  .module-a.reverse { flex-direction: column; }
  .module-b .b-frame { max-width: 85%; }
  .module-c { grid-template-columns: 1fr; gap: var(--spacing-md); min-height: auto; }
  .module-c .c-main { grid-column: 1; grid-row: 1; }
  .module-c .c-caption { grid-column: 1; grid-row: 2; text-align: left; justify-self: start; }
  .module-c .c-sub { grid-column: 1; grid-row: 3; max-width: 60%; justify-self: start; }
  .module-c.reverse .c-main { grid-column: 1; grid-row: 1; }
  .module-c.reverse .c-caption { grid-column: 1; grid-row: 2; text-align: left; justify-self: start; }
  .module-c.reverse .c-sub { grid-column: 1; grid-row: 3; max-width: 60%; justify-self: start; }
  .module-d .d-overlay { bottom: var(--spacing-md); left: var(--spacing-md); }
  .module-e { flex-direction: column; gap: var(--spacing-md); min-height: auto; }
  .module-e .e-photo { flex: 0 0 auto; width: 80%; }
  .module-e .e-text { flex: 0 0 auto; width: 80%; }
}

@media (max-width: 640px) {
  :root {
    --spacing-md: 32px;
    --spacing-lg: 40px;
    --spacing-xl: 64px;
    --spacing-2xl: 80px;
  }
  .module { padding: 0 var(--spacing-sm); }
  .module-a .a-visual, .module-a .a-copy { width: 90%; }
  .module-b .b-frame { max-width: 95%; }
  .module-c .c-sub { max-width: 80%; }
  .module-e .e-photo, .module-e .e-text { width: 90%; }
  .hero h1 { font-size: clamp(2rem, 8vw, 3rem); }
}
</style>
</head>
<body>

<!-- ============================================================
     HERO
     ============================================================ -->
<section class="hero" id="hero">
  <!-- Leaf Pile — scattered thumbnail collage -->
  <div class="leaf-pile" id="leafPile" aria-label="Photo thumbnails collage"></div>

  <div class="hero-inner reveal-stagger">
    <div class="hero-rule reveal"></div>
    <div class="hero-tag reveal">Editorial Portfolio</div>
    <h1 class="reveal"><em>Jang</em>Wonyoung</h1>
    <p class="reveal">
      A study in light, form, and grace.<br>
      Thirty-four frames — each a singular moment.
    </p>
  </div>
</section>

<!-- All photo modules are generated by JS below -->

<!-- ============================================================
     FOOTER
     ============================================================ -->
<footer class="footer reveal">
  <div class="footer-rule"></div>
  JANG WONYOUNG &copy; 2026<br>
  Editorial Photography Portfolio
</footer>

<script>
// ============================================================
// PHOTO DATA
// ============================================================
const PHOTO_DIR = 'wy_pic/';

// ============================================================
// SHUFFLE (seeded for reproducibility)
// ============================================================
let seed = 137;
function seededRandom() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
const shuffled = photoFiles.map((f, i) => ({ file: f, idx: i, r: seededRandom() }));
shuffled.sort((a, b) => a.r - b.r);

// ============================================================
// BUILD LEAF PILE — Scattered thumbnail collage
// ============================================================
(function buildLeafPile() {
  const pile = document.getElementById('leafPile');
  const leafCount = photoFiles.length; // 34
  const pileW = pile.clientWidth;
  const pileH = pile.clientHeight;

  // Use a separate seed so leaf pile is deterministic but distinct from layout shuffle
  let ls = 271;
  function lr() { ls = (ls * 16807) % 2147483647; return (ls - 1) / 2147483646; }

  // Define an organic cluster center and radius
  const cx = pileW * 0.5;
  const cy = pileH * 0.48;
  const rx = pileW * 0.44;
  const ry = pileH * 0.38;

  // Leaf sizes — small thumbnails like scattered prints
  const leafSizes = [
    { w: 95, h: 130 }, { w: 80, h: 110 }, { w: 105, h: 80 },
    { w: 90, h: 125 }, { w: 110, h: 85 }, { w: 85, h: 115 },
    { w: 100, h: 100 }, { w: 75, h: 105 }, { w: 95, h: 75 },
    { w: 88, h: 120 }, { w: 108, h: 90 }, { w: 82, h: 108 },
  ];

  // Generate positions using a spiral scatter with jitter
  const positions = [];
  for (let i = 0; i < leafCount; i++) {
    // Golden-angle spiral to distribute evenly within the ellipse
    const angle = i * 2.399963; // golden angle in radians
    const r = Math.sqrt((i + 0.5) / leafCount); // sqrt for uniform disc distribution
    const x = cx + Math.cos(angle) * r * rx;
    const y = cy + Math.sin(angle) * r * ry;

    // Add organic jitter
    const jx = (lr() - 0.5) * 50;
    const jy = (lr() - 0.5) * 40;
    // Some leaves pushed further out to the edges
    const edgePush = i < 8 ? (1 - r) * (lr() * 80 + 40) : 0;

    const size = leafSizes[Math.floor(lr() * leafSizes.length)];

    positions.push({
      x: x + jx + (lr() - 0.5) * edgePush * 0.3,
      y: y + jy + (lr() - 0.5) * edgePush * 0.3,
      w: size.w,
      h: size.h,
      rotation: (lr() - 0.5) * 50, // -25deg to +25deg — varied scatter
      z: Math.floor(lr() * 30), // z-index stacking
      isPolaroid: lr() < 0.22,
      isTaped: lr() < 0.32,
      file: photoFiles[i],
    });
  }

  // Sort by z-index for proper stacking (back to front)
  positions.sort((a, b) => a.z - b.z);

  // Create DOM elements
  positions.forEach((pos, i) => {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    if (pos.isPolaroid) leaf.classList.add('polaroid-leaf');
    if (pos.isTaped) leaf.classList.add('taped-leaf');

    // Position — center the leaf on its x,y
    const left = pos.x - pos.w / 2;
    const top = pos.y - pos.h / 2;

    leaf.style.cssText = `
      left: ${left.toFixed(0)}px;
      top: ${top.toFixed(0)}px;
      width: ${pos.w}px;
      height: ${pos.isPolaroid ? pos.h + 18 : pos.h}px;
      --leaf-rot: ${pos.rotation.toFixed(1)}deg;
      transform: rotate(${pos.rotation.toFixed(1)}deg);
      z-index: ${pos.z};
    `;

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = 'Thumbnail ' + (i + 1);
    // Use data-src for lazy loading — swap on intersection
    img.dataset.src = PHOTO_DIR + pos.file;
    if (pos.isPolaroid) {
      img.style.height = pos.h + 'px';
    }

    leaf.appendChild(img);

    // Click to scroll to the corresponding module
    leaf.addEventListener('click', (e) => {
      e.stopPropagation();
      // Find and scroll to the first module containing this photo
      const modules = document.querySelectorAll('.module, .module-d');
      const targetFile = pos.file;
      for (const mod of modules) {
        const imgs = mod.querySelectorAll('img[data-src], img[src]');
        for (const mi of imgs) {
          const src = mi.src || mi.dataset.src || '';
          if (src.includes(targetFile)) {
            mod.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Flash highlight
            mod.style.transition = 'box-shadow 0.3s ease';
            mod.style.boxShadow = '0 0 0 4px rgba(184,151,110,0.3)';
            setTimeout(() => {
              mod.style.boxShadow = '';
              setTimeout(() => { mod.style.transition = ''; }, 300);
            }, 800);
            return;
          }
        }
      }
    });

    pile.appendChild(leaf);
  });

  // Lazy-load leaf images via IntersectionObserver
  // (short delay — the leaf pile is above the fold, so they load quickly)
  const leafObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const imgs = entry.target.querySelectorAll('img[data-src]');
        imgs.forEach(img => {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        });
        leafObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin: '200px' });

  leafObserver.observe(pile);
})();

// ============================================================
// DEFINE THE LAYOUT SEQUENCE
// ============================================================
// We have 34 photos. Module A/B/D/E each use 1 photo, Module C uses 2.
// The layout MUST consume exactly 34 photos.
//
// Sequence: B-A-C-D-E-A-C-B-D-E-A-C-[divider]-B-C-D-E-A-C-B-D-E-A-C-B
// Photo count: 1+1+2+1+1+1+2+1+1+1+1+2 + 1+2+1+1+1+2+1+1+1+1+2+1 = 34 ✓

const layoutPlan = [];
let pi = 0;

// Helper: consume one photo from shuffled array, returns {file, idx}
function next() {
  const item = shuffled[pi++];
  return { file: item.file, idx: item.idx };
}

// Helper: push a module with idx stored at definition time (not build time)
function P(type, opts = {}) {
  const entry = { type, ...opts };
  layoutPlan.push(entry);
}

// 1. B — gentle opening (1)
P('B', next());
// 2. A — tension close-up (1)
P('A', { ...next(), reverse: false });
// 3. C — diagonal duo (2)
P('C', { fileMain: next().file, fileSub: next().file, idx: next().idx, reverse: false });
// → adjust: C needs its own idx. Use the first photo's idx.
// Actually let me restructure — store idx explicitly on each entry

// Clear and redo cleanly
layoutPlan.length = 0;
pi = 0;

function plan(type, config = {}) {
  layoutPlan.push({ type, ...config });
}

// Consume photos: track how many used so far
// A=1, B=1, C=2, D=1, E=1, divider=0
// Pattern for 34: B(1) A(2) C(4) D(5) E(6) A(7) C(9) B(10) D(11) E(12) A(13) C(15)
//                [divider]
//                B(16) C(18) D(19) E(20) A(21) C(23) B(24) D(25) E(26) A(27) C(29) B(30) B(31) A(32) E(33) D(34)

plan('B', next());                          //  1
plan('A', { ...next(), reverse: false });   //  2
plan('C', { f1: next(), f2: next(), reverse: false }); //  4
plan('D', next());                          //  5
plan('E', { ...next(), reverse: false });   //  6
plan('A', { ...next(), reverse: true });    //  7
plan('C', { f1: next(), f2: next(), reverse: true });  //  9
plan('B', next());                          // 10
plan('D', next());                          // 11
plan('E', { ...next(), reverse: false });   // 12
plan('A', { ...next(), reverse: false });   // 13
plan('C', { f1: next(), f2: next(), reverse: false }); // 15

plan('divider');

plan('B', next());                          // 16
plan('C', { f1: next(), f2: next(), reverse: true });  // 18
plan('D', next());                          // 19
plan('E', { ...next(), reverse: false });   // 20
plan('A', { ...next(), reverse: true });    // 21
plan('C', { f1: next(), f2: next(), reverse: false }); // 23
plan('B', next());                          // 24
plan('D', next());                          // 25
plan('E', { ...next(), reverse: false });   // 26
plan('A', { ...next(), reverse: false });   // 27
plan('C', { f1: next(), f2: next(), reverse: true });  // 29
plan('B', next());                          // 30
plan('B', next());                          // 31
plan('A', { ...next(), reverse: true });    // 32
plan('E', { ...next(), reverse: false });   // 33
plan('D', next());                          // 34

// ============================================================
// BUILD THE DOM
// ============================================================
const hero = document.getElementById('hero');

function buildHTML(p) {
  switch (p.type) {
    case 'A': return buildModuleA(p.file, p.idx, p.reverse);
    case 'B': return buildModuleB(p.file, p.idx);
    case 'C': return buildModuleC(p.f1.file, p.f2.file, p.f1.idx, p.reverse);
    case 'D': return buildModuleD(p.file, p.idx);
    case 'E': return buildModuleE(p.file, p.idx, p.reverse);
    case 'divider': return `
      <div class="divider reveal">
        <div class="divider-inner">
          <div class="divider-rule"></div>
          <div class="divider-label">Portfolio</div>
          <div class="divider-title">The Collection Continues</div>
        </div>
      </div>`;
    default: return '';
  }
}

let htmlStr = '';
layoutPlan.forEach(p => {
  const html = buildHTML(p);
  if (p.type !== 'divider') {
    // Track index for staggered animation identity — we assign after build
  }
  htmlStr += html;
});

hero.insertAdjacentHTML('afterend', htmlStr);

// Debug: count how many photos were used
const totalUsed = layoutPlan.reduce((sum, p) => {
  if (p.type === 'C') return sum + 2;
  if (p.type === 'divider') return sum;
  return sum + 1;
}, 0);
console.log('Photos used in layout:', totalUsed, '/', photoFiles.length);

// ============================================================
// INTERSECTION OBSERVER — Lazy Activation
// ============================================================
const observerOptions = {
  root: null,
  rootMargin: '120px 0px 120px 0px',
  threshold: 0.08
};

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const el = entry.target;

      // Add .is-visible to trigger the CSS animation
      el.classList.add('is-visible');

      // Swap data-src → src for lazy images inside this module
      const imgs = el.querySelectorAll('img[data-src]');
      imgs.forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        // Once the real src is set, the image loads and the reveal animation
        // shows it fading in smoothly
      });

      // Stop observing once revealed
      observer.unobserve(el);
    }
    // Note: we do NOT remove .is-visible when leaving viewport —
    // this avoids layout thrashing. Once revealed, stays revealed.
  });
}, observerOptions);

// Observe all .reveal elements
document.querySelectorAll('.reveal').forEach(el => {
  observer.observe(el);
});

// Also observe the hero stagger children
document.querySelectorAll('.reveal-stagger > .reveal').forEach(el => {
  observer.observe(el);
});

// ============================================================
// IMAGE LOAD ERROR HANDLING
// ============================================================
document.addEventListener('error', function(e) {
  if (e.target.tagName === 'IMG') {
    e.target.style.background = '#e8e6e2';
    e.target.style.minHeight = '300px';
    console.warn('Image failed to load:', e.target.dataset.src || e.target.src);
  }
}, true);

console.log('✨ Editorial layout ready. Scroll to explore.');
console.log('🖼️  All photos lazy-loaded via IntersectionObserver');
console.log('📐  Layout: Asymmetric editorial — Vogue-style');
</script>
